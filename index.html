<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechnoWizards Sorting Ceremony</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧙‍♂️ TechnoWizards Sorting Ceremony 🤖</h1>
            <p class="subtitle" id="subtitle">Choose your language / Elige tu idioma</p>
        </header>

        <div id="language-container">
            <div id="language-grid"></div>
        </div>

        <div id="quiz-container" style="display: none;">
            <div id="question-container">
                <h2 id="question-text"></h2>
                <div id="answers-container"></div>
            </div>

            <div id="progress">
                <span id="progress-text"></span>
            </div>
        </div>

        <div id="result-container" style="display: none;">
            <h2 id="sorted-into-text"></h2>
            <div id="house-result"></div>
            <p id="house-description"></p>
            <button onclick="restartQuiz()" class="restart-btn" id="restart-btn"></button>
            <button onclick="changeLanguage()" class="language-btn" id="change-language-btn"></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
